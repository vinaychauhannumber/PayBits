<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111111" />
      <stop offset="100%" stop-color="#000000" />
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="35%" r="55%">
      <stop offset="0%" stop-color="#d0872e" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0ab56" />
      <stop offset="50%" stop-color="#d0872e" />
      <stop offset="100%" stop-color="#b87322" />
    </linearGradient>
  </defs>

  <!-- Canvas -->
  <rect width="1200" height="630" fill="url(#bg)" />
  <rect width="1200" height="630" fill="url(#glow)" />

  <!-- Outer Border -->
  <rect x="30" y="30" width="1140" height="570" rx="28" fill="none" stroke="#262626" stroke-width="2" />

  <!-- Logo Squircle -->
  <g transform="translate(520, 90)">
    <rect width="160" height="160" rx="38" fill="#161616" stroke="#737373" stroke-width="2" stroke-opacity="0.4" />
    <rect x="44" y="42" width="38" height="38" rx="8" fill="url(#gold)" />
    <rect x="47" y="86" width="32" height="32" rx="7" fill="url(#gold)" />
    <rect x="86" y="55" width="32" height="32" rx="7" fill="url(#gold)" />
  </g>

  <!-- Brand Title -->
  <text x="600" y="320" text-anchor="middle" font-family="Georgia, serif" font-size="64" font-weight="bold" fill="#ffffff">
    Pay<tspan fill="url(#gold)">Bits</tspan>
  </text>

  <!-- Tagline -->
  <text x="600" y="375" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="600" fill="#737373" letter-spacing="1">
    SMART UPI PAYMENT SPLITTER
  </text>

  <!-- Description -->
  <text x="600" y="425" text-anchor="middle" font-family="sans-serif" font-size="20" fill="#a3a3a3">
    Split large UPI bills into manageable chunks with instant QR codes and 1-tap app launchers
  </text>

  <!-- Badges / Features -->
  <g transform="translate(250, 480)">
    <rect x="0" y="0" width="150" height="44" rx="22" fill="#1c1c1c" stroke="#333333" />
    <text x="75" y="28" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="600" fill="#f0ab56">⚡ Instant QRs</text>

    <rect x="170" y="0" width="170" height="44" rx="22" fill="#1c1c1c" stroke="#333333" />
    <text x="255" y="28" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="600" fill="#f0ab56">📱 1-Tap UPI Apps</text>

    <rect x="360" y="0" width="170" height="44" rx="22" fill="#1c1c1c" stroke="#333333" />
    <text x="445" y="28" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="600" fill="#f0ab56">💬 WhatsApp Receipts</text>

    <rect x="550" y="0" width="150" height="44" rx="22" fill="#1c1c1c" stroke="#333333" />
    <text x="625" y="28" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="600" fill="#f0ab56">🔒 100% Private</text>
  </g>

  <!-- URL Watermark -->
  <text x="600" y="565" text-anchor="middle" font-family="monospace" font-size="15" fill="#525252" letter-spacing="2">
    PAYBITS.VERCEL.APP
  </text>
</svg>