<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181818" />
      <stop offset="100%" stop-color="#000000" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0ab56" />
      <stop offset="50%" stop-color="#d0872e" />
      <stop offset="100%" stop-color="#b87322" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#d0872e" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Background Squircle -->
  <rect width="512" height="512" rx="118" fill="url(#bgGrad)" stroke="#737373" stroke-width="6" stroke-opacity="0.4" />

  <!-- The 3 PayBits Squares -->
  <g filter="url(#glow)">
    <!-- Top-left large square -->
    <rect x="140" y="135" width="120" height="120" rx="24" fill="url(#goldGrad)" />
    
    <!-- Bottom-left square -->
    <rect x="150" y="275" width="100" height="100" rx="20" fill="url(#goldGrad)" />
    
    <!-- Middle-right square -->
    <rect x="275" y="175" width="100" height="100" rx="20" fill="url(#goldGrad)" />
  </g>
</svg>